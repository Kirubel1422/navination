[project]
name = "navination-api"
version = "1.0.0"
description = "NaviNation backend: discovery, rule screening, journey planning, coaching and verified handoffs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "openai>=3.40.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is enforced by `ruff format`; long localized strings are allowed.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
