      certificates: 2
      recognition: 3
      recognise: 3
      recognize: 3
      recognised: 3
      recognized: 3
      equivalency: 3
      equivalence: 3
      equalise: 3
      equalize: 3
      equalised: 3
      equalized: 3
      attest: 3
      attestation: 3
      attested: 3
      transcript: 2
      transcripts: 2
      graduated: 2
      studied: 1
      education: 2
      abroad: 1
      overseas: 1
      foreign: 1
      school: 1
      "high school": 3
      "secondary school": 3
      "grade 12": 3
    ar:
