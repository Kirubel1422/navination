      دكتوراه: 3
      دبلوم: 2
      تعليم: 1
      الخارج: 1
      اجنبيه: 1
      دراستي: 1
      الثانويه: 3
      ثانويه: 3
      مدرسه: 1
      المدرسه: 1
  facets:
    - id: university
      label: {en: "A university degree or other higher education qualification", ar: "شهادة جامعية أو مؤهل تعليم عالٍ"}
      keywords:
        en: [degree, degrees, bachelor, bachelors, master, masters, phd, doctorate, university, college, diploma, graduated, "higher education"]
        ar: [جامعه, الجامعه, جامعيه, الجامعيه, بكالوريوس, ماجستير, دكتوراه, دبلوم]
    - id: school
      label: {en: "A school (secondary / grade 12) certificate", ar: "شهادة مدرسية (الثانوية العامة / الصف الثاني عشر)"}
      keywords:
        en: [school, "high school", "secondary school", "grade 12", secondary, grade]
        ar: [الثانويه, ثانويه, مدرسه, المدرسه, مدرسيه]
  clarification:
    prompt:
      en: "Which qualification do you want to use in the UAE?"
      ar: "ما المؤهل الذي تريد استخدامه في الإمارات؟"
  examples:
    en:
      - "I recently arrived and need my overseas degree recognized"
      - "How do I get my foreign high school certificate equalised?"
    ar:
      - "وصلت حديثاً وأحتاج إلى الاعتراف بشهادتي الجامعية من الخارج"

