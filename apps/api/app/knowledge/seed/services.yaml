- id: newborn-residence-permit
  life_event_ids: [new_baby]
  facets: []
  title: {en: "Issue the baby's residence permit and Emirates ID", ar: "إصدار إقامة المولود وبطاقة الهوية الإماراتية"}
  summary:
    en: "ICP's Issuing Residency Permit service issues a new residence permit linked to an Emirates ID application. For family members, the sponsor must hold a valid UAE residence and meet the income condition."
    ar: "تصدر خدمة «إصدار تصريح إقامة» لدى الهيئة الاتحادية للهوية والجنسية تصريح إقامة جديداً مرتبطاً بطلب بطاقة الهوية. ولأفراد الأسرة يجب أن يحمل الكفيل إقامة سارية في الدولة وأن يستوفي شرط الدخل."
  entity: {en: "Federal Authority for Identity, Citizenship, Customs and Port Security (ICP); GDRFA in Dubai", ar: "الهيئة الاتحادية للهوية والجنسية والجمارك وأمن المنافذ؛ والإدارة العامة للإقامة وشؤون الأجانب في دبي"}
  jurisdiction: {en: "Federal (ICP), with GDRFA Dubai for Dubai", ar: "اتحادي (الهيئة الاتحادية)، والإدارة العامة للإقامة في دبي لإمارة دبي"}
  authority: {en: "ICP (or GDRFA Dubai)", ar: "الهيئة الاتحادية للهوية والجنسية (أو الإدارة العامة للإقامة وشؤون الأجانب بدبي)"}
  fee_text:
    en: "ICP lists AED 100 application, AED 100 issuance per year, AED 100 smart service and AED 20 financial security deposit fees. Your total may differ."
    ar: "تذكر الهيئة رسوم طلب 100 درهم، وإصدار 100 درهم لكل سنة، وخدمات ذكية 100 درهم، وتأمين مالي 20 درهماً. قد يختلف المجموع في حالتك."
  processing_time_text:
    en: "ICP lists a service completion duration of 2 days."
    ar: "تذكر الهيئة أن مدة إنجاز الخدمة يومان."
  official_url: https://icp.gov.ae/en/services-details/?serviceid=64afe3c1035448005bd52e64
  support_url: https://u.ae/en/information-and-services/visa-and-emirates-id/Types-of-visas/Residence-visa/residence-visa-for-family-members
  verification_status: verified
  source_ids: [src-icp-residency-permit, src-uae-having-a-baby, src-uae-family-residence]
  keywords:
    en: [visa, residence, residency, "emirates id", sponsor, permit]
    ar: [اقامه, الاقامه, تاشيره, "الهويه الاماراتيه", كفيل]
  requirements:
    - id: newborn-residence-permit.c1
      kind: criterion
      text:
        en: "The sponsoring parent holds a valid UAE residence."
        ar: "أن يحمل الوالد الكفيل إقامة سارية في الدولة."
      source_ids: [src-icp-residency-permit]
      rule: {field: residency_status, in: [resident]}
    - id: newborn-residence-permit.c2
      kind: criterion
      text:
        en: "Sponsor's minimum monthly income: AED 4,000, or AED 3,000 with housing provided."
        ar: "الحد الأدنى لدخل الكفيل الشهري: 4,000 درهم، أو 3,000 درهم مع توفير السكن."
      source_ids: [src-icp-residency-permit, src-uae-family-residence]
    - id: newborn-residence-permit.c3
      kind: criterion
      text:
        en: "Residents must complete the baby's documents, including the visa, within 120 days of birth. After that AED 100 per day applies, and the baby cannot leave the country until the residence visa is finalised."
        ar: "على المقيمين إنجاز وثائق المولود بما فيها التأشيرة خلال 120 يوماً من الولادة، وبعدها تُفرض 100 درهم عن كل يوم، ولا يمكن للمولود مغادرة الدولة قبل إنجاز الإقامة."
      source_ids: [src-uae-having-a-baby]
    - id: newborn-residence-permit.d1
      kind: document
      text:
        en: "The baby's passport, valid for at least 6 months."
        ar: "جواز سفر المولود ساري المفعول لمدة لا تقل عن 6 أشهر."
      source_ids: [src-icp-residency-permit]
    - id: newborn-residence-permit.d2
      kind: document
      text:
        en: "A personal photo."
        ar: "صورة شخصية."
      source_ids: [src-icp-residency-permit]
    - id: newborn-residence-permit.d3
      kind: document
      text:
        en: "Valid health insurance."
        ar: "تأمين صحي ساري المفعول."
      source_ids: [src-icp-residency-permit]
    - id: newborn-residence-permit.d4
      kind: document
      text:
        en: "The birth certificate (to prove the child's age)."
        ar: "شهادة الميلاد (لإثبات عمر الطفل)."
      source_ids: [src-icp-residency-permit]
  profile_hints:
    - field: emirate
      values:
        dubai:
          en: "u.ae names both ICP and GDRFA for family residence. For a Dubai-issued residence, check with GDRFA Dubai."
          ar: "تذكر بوابة u.ae الهيئة الاتحادية والإدارة العامة للإقامة لإقامة الأسرة. إذا كانت إقامتك صادرة من دبي فتحقق مع الإدارة العامة للإقامة وشؤون الأجانب بدبي."
      source_ids: [src-uae-family-residence]

